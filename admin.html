<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin｜Qool Voices</title>
  <link rel="stylesheet" href="style.css" />
  
</head>
<body data-page="admin">
  <header class="site-header">
    <div class="nav-wrap">
      <a href="index.html" class="logo-link">
        <div class="logo-slot">LOGO</div>
        <div class="brand-block">
          <p class="brand-en">Qool Voices</p>
          <h1 class="brand-zh">酷女聲</h1>
        </div>
      </a>

      <nav class="main-nav">
        <a href="directory.html">Directory</a>
        <a href="submit.html">Submit</a>
        <a href="admin.html" class="active-nav">Admin</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <section class="content-card form-card">
      <p class="section-label">Admin</p>
      <h2>資料審核後台</h2>
      <p class="section-intro">只有管理員登入後才能查看待審核資料。</p>

      <form id="adminLoginForm" class="profile-form admin-login-form">
        <label>
          Email
          <input type="email" name="email" required />
        </label>

        <label>
          Password
          <input type="password" name="password" required />
        </label>

        <button type="submit" class="cta-button">登入</button>
        <p id="adminLoginMessage" class="form-message"></p>
      </form>

      <div id="adminPanel" hidden>
        <div class="admin-toolbar">
          <button id="refreshPendingBtn" class="reset-button" type="button">重新整理</button>
          <button id="logoutBtn" class="reset-button" type="button">登出</button>
        </div>

        <div id="pendingList" class="admin-list"></div>
        <p id="pendingEmpty" class="empty-state" hidden>目前沒有待審核資料。</p>
      </div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
  <footer class="site-footer">
  <div class="footer-inner">

    <p class="footer-contact">
      Contact｜qoolvoices@gmail.com
    </p>

  </div>
</footer>
</body>
</html>
