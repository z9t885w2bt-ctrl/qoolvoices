<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>資料酷｜Qool Voices</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body data-page="directory">
  <header class="site-header">
    <div class="nav-wrap">
      <a href="index.html" class="logo-link">
        <div class="logo-slot">LOGO</div>
        <div class="brand-block">
          <p class="brand-en">Qool Voices</p>
          <h1 class="brand-zh">酷女聲</h1>
        </div>
      </a>

      <nav class="main-nav">
        <a href="about.html">About</a>
        <a href="interviews.html">Interviews</a>
        <a href="directory.html" class="active-nav">Directory</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <section class="content-card">
      <p class="section-label">Directory</p>
      <h2>資料酷</h2>
      <p class="section-intro">
        你可以依照活動地區、職能、活躍場景，找到適合的合作夥伴。
      </p>

      <div class="page-actions">
        <a href="submit.html" class="cta-button">加入資料酷</a>
      </div>

      <div class="filters">
        <select id="regionFilter">
          <option value="all">全部活動地區</option>
          <option value="north">北部</option>
          <option value="middle">中部</option>
          <option value="south">南部</option>
          <option value="east">東部</option>
          <option value="outer_islands">離島</option>
          <option value="abroad">非臺灣國家</option>
        </select>

        <select id="roleFilter">
          <option value="all">全部職能</option>
          <option value="Singer">歌手 Singer</option>
          <option value="Rapper">饒舌 Rapper</option>
          <option value="Instrumentalist">樂手 Instrumentalist</option>
          <option value="DJ">DJ</option>
          <option value="Songwriter">作曲 Songwriter</option>
          <option value="Lyricist">作詞 Lyricist</option>
          <option value="Producer">製作人 Producer</option>
          <option value="Recording Engineer">錄音 Recording Engineer</option>
          <option value="Mixing Engineer">混音 Mixing Engineer</option>
          <option value="Mastering Engineer">母帶 Mastering Engineer</option>
          <option value="Live Sound Engineer">音響技師 Live Sound Engineer</option>
          <option value="Instrument Tech">樂器技師 Instrument Tech</option>
          <option value="Lighting">燈光 Lighting</option>
          <option value="Photographer">攝影 Photographer</option>
          <option value="Visual Artist">視覺 Visual Artist</option>
          <option value="Director">導演 Director</option>
          <option value="Video Creator">影像創作 Video Creator</option>
          <option value="Video Editor">剪輯 Video Editor</option>
          <option value="Management">經紀 Management</option>
          <option value="Marketing">行銷 Marketing</option>
          <option value="Event Organizer">活動企劃 Event Organizer</option>
          <option value="Music Education">音樂教學 Music Education</option>
        </select>

        <select id="sceneFilter">
          <option value="all">全部場景</option>
          <option value="Live House">Live House</option>
          <option value="Indie Scene">Indie Scene</option>
          <option value="Club / Party">Club / Party</option>
          <option value="Electronic Scene">Electronic Scene</option>
          <option value="Experimental Scene">Experimental Scene</option>
          <option value="DIY / Underground">DIY / Underground</option>
          <option value="Queer Party Scene">Queer Party Scene</option>
        </select>

        <button id="resetFilters" class="reset-button" type="button">清除篩選</button>
      </div>

      <p class="result-count">找到 <span id="resultCount">0</span> 位合作夥伴</p>

      <div id="directoryGrid" class="directory-grid"></div>
      <p id="directoryEmpty" class="empty-state" hidden>目前沒有符合條件的資料。</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-contact">Contact｜qoolvoices@gmail.com</p>
    </div>
  </footer>

  <script src="script.js?v=20260314-1"></script>
</body>
</html>
