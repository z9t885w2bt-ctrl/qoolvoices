<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qool Voices 酷女聲 | 台灣女性與酷兒音樂創作者平台</title>
  <meta name="description" content="酷女聲 Qool Voices 是支持女性與酷兒音樂創作者的文化平台，收錄音樂人、場地與訪談，建立合作與互助的音樂社群。" />
  <link rel="stylesheet" href="style.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Space+Mono:wght@700&display=swap');

    .home-wrap {
      min-height: 100vh;
      padding: 40px 36px 80px;
      background:
        radial-gradient(ellipse at 30% 20%, #d4c8e8 0%, transparent 55%),
        radial-gradient(ellipse at 75% 65%, #b8e8e0 0%, transparent 50%),
        radial-gradient(ellipse at 55% 90%, #e8d4b8 0%, transparent 45%),
        #e8e2f0;
      font-family: 'Space Mono', monospace;
      position: relative;
      overflow: hidden;
    }

    .orb { position: absolute; border-radius: 50%; pointer-events: none; }
    .orb1 { width: 280px; height: 280px; top: -60px; right: -40px; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.85) 0%, rgba(181,126,220,0.4) 35%, rgba(99,214,198,0.25) 70%, transparent 85%); }
    .orb2 { width: 180px; height: 180px; bottom: 80px; left: -30px; background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.8) 0%, rgba(99,214,198,0.4) 40%, transparent 80%); }

    .home-inner { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; }

    /* topbar */
    .home-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 56px; }
    .home-topbar a { font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; text-decoration: none; color: #3a2a5a; padding: 7px 16px; border: 1.5px solid rgba(181,126,220,0.5); border-radius: 2px; background: rgba(255,255,255,0.4); box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 2px 8px rgba(181,126,220,0.15); }

    /* hero */
    .hero { margin-bottom: 72px; }
    .hero-brand-zh { font-family: 'Noto Serif TC', serif; font-size: clamp(72px, 13vw, 130px); font-weight: 900; line-height: 0.9; letter-spacing: 8px; display: block; background: linear-gradient(160deg, #fff 0%, #e8d4f5 15%, #b57edc 30%, #7ecdc4 50%, #d4b8e8 65%, #fff 78%, #c8e8e0 90%, #b57edc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 2px 0 rgba(181,126,220,0.8)) drop-shadow(0 6px 0 rgba(126,205,196,0.4)) drop-shadow(0 12px 24px rgba(100,50,150,0.2)); }
    .hero-brand-sub { display: flex; align-items: center; gap: 16px; margin-top: 12px; transform: translateX(8px); }
    .hero-brand-en { font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #5a3a8a; opacity: 0.7; }
    .hero-brand-rule { flex: 1; max-width: 180px; height: 1.5px; background: linear-gradient(90deg, rgba(181,126,220,0.8), transparent); }

    .manifesto { margin-top: 40px; max-width: 560px; padding: 24px 28px; background: linear-gradient(135deg, rgba(255,255,255,0.65), rgba(232,210,248,0.4), rgba(200,240,234,0.3)); border: 1px solid rgba(255,255,255,0.9); border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 28px rgba(100,50,150,0.1); transform: rotate(-0.5deg); position: relative; }
    .manifesto::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(181,126,220,0.8), rgba(99,214,198,0.6), rgba(255,200,100,0.5), rgba(255,255,255,0.8)); border-radius: 0 2px 2px 0; }
    .manifesto-label { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #9a6abf; font-weight: 700; margin-bottom: 10px; display: block; }
    .manifesto-text { font-family: 'Noto Serif TC', serif; font-size: clamp(15px, 2.2vw, 20px); font-weight: 700; color: #2a1a3a; line-height: 1.55; }
    .manifesto-sub { font-size: 11px; color: #5a7a76; margin-top: 10px; font-style: italic; }

    /* cards */
    .cards-header { display: flex; align-items: center; gap: 14px; margin-top: 72px; margin-bottom: 48px; }
    .cards-header-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #7a6a9a; font-weight: 700; }
    .cards-header-rule { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(181,126,220,0.5), transparent); }

    .cards-row { display: flex; flex-direction: row; align-items: flex-end; justify-content: space-around; gap: 0; min-height: 380px; }

    .morph-card { text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1; padding: 0 12px; }
    .morph-card:nth-child(1) { align-self: flex-end; }
    .morph-card:nth-child(2) { align-self: center; margin-bottom: 40px; }
    .morph-card:nth-child(3) { align-self: flex-end; padding-bottom: 20px; }

    .card-label { text-align: center; margin-top: 20px; }
    .card-zh { font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 900; display: block; background: linear-gradient(160deg, #2a0a4a, #7a4aaa, #2a6a60); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .card-en { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #7a6a9a; margin-top: 3px; display: block; }
    .card-desc { font-size: 11px; color: rgba(40,20,70,0.55); margin-top: 6px; text-align: center; max-width: 150px; line-height: 1.5; font-family: Arial, sans-serif; }

    /* 貝殼 */
    .shell-scene { width: 180px; height: 200px; position: relative; perspective: 400px; }
    .shell-bot { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 160px; height: 90px; }
    .shell-bot svg { width: 100%; height: 100%; }
    .shell-top { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%) rotateX(0deg); transform-origin: bottom center; transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.34,1.3,0.64,1); width: 160px; height: 100px; }
    .shell-top svg { width: 100%; height: 100%; }
    .morph-card:hover .shell-top { transform: translateX(-50%) rotateX(-55deg) translateY(-10px); }
    .pearl { position: absolute; bottom: 78px; left: 50%; transform: translateX(-50%) scale(0); width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, #fff 0%, rgba(240,220,255,0.95) 18%, rgba(200,235,228,0.85) 42%, rgba(181,126,220,0.65) 65%, rgba(99,214,198,0.55) 85%, rgba(150,100,200,0.4) 100%); box-shadow: 0 4px 18px rgba(181,126,220,0.55), 0 0 28px rgba(181,126,220,0.25), inset 0 2px 8px rgba(255,255,255,0.85); transition: transform 0.45s cubic-bezier(0.34,1.56,0.64,1) 0.18s; z-index: 5; }
    .morph-card:hover .pearl { transform: translateX(-50%) scale(1) translateY(-4px); }

    /* 禮盒 */
    .gift-scene { width: 160px; height: 200px; position: relative; }

    /* 路燈 */
    .lamp-scene { width: 120px; height: 220px; position: relative; }
    .lamp-pole { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 8px; height: 170px; background: linear-gradient(90deg, rgba(255,255,255,0.3), rgba(181,150,220,0.7) 40%, rgba(140,100,200,0.8) 60%, rgba(100,70,160,0.5)); border-radius: 4px; }
    .lamp-arm { position: absolute; bottom: 162px; left: 50%; width: 44px; height: 7px; background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(160,120,210,0.7)); border-radius: 4px; }
    .lamp-head { position: absolute; bottom: 163px; left: calc(50% + 32px); width: 30px; height: 18px; background: linear-gradient(180deg, rgba(200,180,240,0.8), rgba(160,130,210,0.9)); border-radius: 4px 4px 8px 8px; box-shadow: inset 0 2px 4px rgba(255,255,255,0.5); }
    .lamp-bulb { position: absolute; bottom: 150px; left: calc(50% + 36px); width: 22px; height: 22px; border-radius: 50%; background: rgba(220,200,255,0.3); transition: background 0.3s, box-shadow 0.4s; }
    .morph-card:hover .lamp-bulb { background: radial-gradient(circle at 40% 35%, #fff 0%, rgba(255,240,140,0.95) 25%, rgba(255,200,80,0.8) 55%, rgba(255,160,40,0.5) 80%, transparent 100%); box-shadow: 0 0 20px rgba(255,220,80,0.9), 0 0 48px rgba(255,200,60,0.6), 0 0 80px rgba(255,180,40,0.3); }
    .lamp-glow { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 110px; height: 55px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,220,80,0) 0%, transparent 100%); transition: background 0.4s; }
    .morph-card:hover .lamp-glow { background: radial-gradient(ellipse, rgba(255,220,80,0.35) 0%, rgba(255,200,60,0.15) 50%, transparent 80%); }
    .lamp-cone { position: absolute; bottom: 0; left: calc(50% + 10px); width: 0; height: 0; border-left: 48px solid transparent; border-right: 48px solid transparent; border-bottom: 150px solid transparent; transition: border-bottom-color 0.4s; transform: translateX(-50%); }
    .morph-card:hover .lamp-cone { border-bottom-color: rgba(255,220,80,0.07); }

    /* footer */
    .home-footer { margin-top: 72px; padding-top: 20px; border-top: 1px solid rgba(181,126,220,0.35); display: flex; justify-content: space-between; align-items: center; }
    .footer-contact { font-size: 12px; letter-spacing: 1px; color: #5a6a68; }
    .footer-mark { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: rgba(90,60,130,0.4); font-style: italic; }

    /* 手機：直排 */
    @media (max-width: 680px) {
      .home-wrap { padding: 28px 24px 64px; }
      .cards-row { flex-direction: column; align-items: center; min-height: unset; gap: 56px; }
      .morph-card:nth-child(1),
      .morph-card:nth-child(2),
      .morph-card:nth-child(3) { align-self: center; margin-bottom: 0; padding-bottom: 0; width: 100%; }
      .shell-scene, .gift-scene, .lamp-scene { margin: 0 auto; }
      .card-desc { max-width: 200px; }
    }
  </style>
</head>
<body>

<div class="home-wrap">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="home-inner">

    <div class="home-topbar">

              <path d="M80,8 Q60,45 52,86" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>

          </div>
          <div class="pearl"></div>
        </div>
        <div class="card-label">
          <span class="card-zh">記憶酷</span>
          <span class="card-en">Interviews</span>
          <span class="card-desc">採訪、場景筆記、文化紀錄</span>
        </div>
      </a>

      <!-- 資料酷：禮盒 -->
      <a href="directory.html" class="morph-card">
        <div class="gift-scene">
          <svg width="160" height="200" viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg">

              </linearGradient>
              <linearGradient id="lidg" x1="0%" y1="0%" x2="100%" y2="100%">

              </linearGradient>

<script>
  const lidG = document.querySelector('.gift-lid-g');
  const bowG = document.querySelector('.bow-g');
  const card2 = document.querySelectorAll('.morph-card')[1];
  if (card2) {
    card2.addEventListener('mouseenter', () => {
      lidG.style.transform = 'rotate(-14deg) translateY(-22px)';
      bowG.style.transform = 'translateY(-26px) scale(1.1)';
    });
    card2.addEventListener('mouseleave', () => {
      lidG.style.transform = '';
      bowG.style.transform = '';
    });
  }
</script>

</body>
