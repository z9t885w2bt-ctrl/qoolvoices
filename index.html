  <script src="script.js"></script>
  <script>
    const lidG = document.querySelector('.gift-lid-g');
    const bowG = document.querySelector('.bow-g');
    const card2 = document.querySelectorAll('.morph-card')[1];
    if (card2) {
      card2.addEventListener('mouseenter', () => {
        lidG.style.transformOrigin = '80px 108px';
        lidG.style.transition = 'transform 0.5s cubic-bezier(0.34,1.4,0.64,1)';
        lidG.style.transform = 'rotate(-14deg) translateY(-22px)';
        bowG.style.transformOrigin = '80px 96px';
        bowG.style.transition = 'transform 0.45s cubic-bezier(0.34,1.56,0.64,1)';
        bowG.style.transform = 'translateY(-26px) scale(1.1)';
      });
      card2.addEventListener('mouseleave', () => {
        lidG.style.transform = '';
        bowG.style.transform = '';
      });
    }
  </script>
