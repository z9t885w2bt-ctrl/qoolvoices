@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Space+Mono:wght@400;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background:

  overflow-x: hidden;
  position: relative;
}

.orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
.orb1 { width: 300px; height: 300px; top: -50px; right: 10%; background: radial-gradient(circle at 38% 38%, rgba(255,255,255,0.82) 0%, rgba(232,200,120,0.35) 42%, rgba(181,126,220,0.18) 72%, transparent 86%); }
.orb2 { width: 240px; height: 240px; bottom: 8%; left: -60px; background: radial-gradient(circle at 42% 38%, rgba(255,255,255,0.78) 0%, rgba(99,170,220,0.3) 46%, transparent 82%); }

.page-wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 36px 80px; }

/* NAV */
nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 28px 36px; margin: 0 -36px; position: sticky; top: 0;
  background: rgba(236,232,224,0.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);

}
.nav-logo { text-decoration: none; display: flex; align-items: baseline; gap: 10px; }
.nav-logo-zh {
  font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 900;
  background: linear-gradient(135deg, #2a0a4a, #7a4aaa, #2a6a60);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.nav-logo-en { font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #7a6030; opacity: 0.65; }
.nav-links { display: flex; gap: 6px; list-style: none; }
.nav-links a {

  text-decoration: none; color: #3a2a10; padding: 6px 13px;

}
.nav-links a:hover { background: rgba(255,255,255,0.65); border-color: rgba(181,150,80,0.6); color: #6a4010; }
.nav-links a.active {
  background: linear-gradient(135deg, rgba(232,200,120,0.28), rgba(181,126,220,0.14));
  border-color: rgba(181,150,80,0.55); color: #6a4010;
}

/* PAGE HEADER */
.page-header { padding: 52px 0 36px; }
.page-label {
  font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
  color: #9a7a30; display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
}
.page-label::after { content: ''; flex: 1; max-width: 120px; height: 1px; background: linear-gradient(90deg, rgba(181,150,80,0.65), transparent); }
.page-title {
  font-family: 'Noto Serif TC', serif; font-size: clamp(40px, 7vw, 68px);
  font-weight: 900; line-height: 1; letter-spacing: 4px;
  background: linear-gradient(160deg, #3a2000 0%, #9a6010 45%, #5a3a8a 85%);

  margin-bottom: 14px;
}
.page-desc { font-size: 12px; color: rgba(40,25,5,0.5); line-height: 1.7; font-family: Arial, sans-serif; max-width: 480px; margin-bottom: 20px; }
.header-cta {
  display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 2.5px;
  text-transform: uppercase; text-decoration: none; color: #3a2a10;
  padding: 9px 20px; border: 1.5px solid rgba(181,150,80,0.5); border-radius: 2px;
  background: rgba(255,255,255,0.5); box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 4px 16px rgba(181,150,80,0.1);
  transition: all 0.2s;
}
.header-cta:hover { background: rgba(232,200,120,0.2); border-color: rgba(181,150,80,0.75); }

/* FILTER BAR */
.filter-wrap {
  display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;
}

.filter-row {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}

.filter-row-label {
  font-size: 8px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
  color: #9a7a30; white-space: nowrap; min-width: 44px;
}

.filter-chip {
  font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; padding: 5px 12px;
  border: 1.5px solid rgba(181,150,80,0.28); border-radius: 2px;
  background: rgba(255,255,255,0.38); color: #3a2a10;
  cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.65); transition: all 0.2s;
  white-space: nowrap;
}
.filter-chip:hover { background: rgba(255,255,255,0.65); border-color: rgba(181,150,80,0.58); }
.filter-chip.active {
  background: linear-gradient(135deg, rgba(232,200,120,0.3), rgba(181,126,220,0.14));
  border-color: rgba(181,150,80,0.58); color: #6a4010;
}

/* RESULTS BAR */
.results-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; margin-bottom: 24px;
  border-bottom: 1px solid rgba(181,150,80,0.18);
}
.result-count { font-size: 10px; letter-spacing: 2px; color: rgba(40,25,5,0.4); }
.result-count strong { font-family: 'Noto Serif TC', serif; font-size: 20px; color: #9a6010; margin-right: 4px; }
.clear-btn {
  font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  background: none; border: 1.5px solid rgba(181,150,80,0.28); border-radius: 2px;
  color: rgba(40,25,5,0.38); padding: 5px 12px; cursor: pointer; transition: all 0.2s;
}
.clear-btn:hover { border-color: rgba(181,126,220,0.5); color: #7a3aaa; }

/* PLACE CARDS */
.places-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;

.place-card {
  text-decoration: none; color: inherit; display: block;
  background: linear-gradient(135deg, rgba(255,255,255,0.62), rgba(240,228,190,0.35), rgba(220,210,240,0.2));

  box-shadow: inset 0 1px 0 rgba(255,255,255,0.88), 0 6px 24px rgba(130,90,20,0.08);
  padding: 22px; position: relative; overflow: hidden;
  transition: transform 0.3s cubic-bezier(0.34,1.3,0.64,1), box-shadow 0.3s;
}

.place-card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
  background: linear-gradient(90deg, rgba(232,200,120,0.6), rgba(181,126,220,0.4), rgba(99,214,198,0.4));
  transform: scaleX(0); transform-origin: left; transition: transform 0.35s cubic-bezier(0.34,1.3,0.64,1);
}
.place-card:hover { transform: translateY(-6px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.92), 0 16px 44px rgba(130,90,20,0.13); }
.place-card:hover::before { transform: scaleX(1); }

.place-num {
  font-size: 8px; font-weight: 700; letter-spacing: 2px; color: rgba(40,25,5,0.22);
  margin-bottom: 12px;
}

.place-type {
  display: inline-block; font-family: 'Space Mono', monospace;
  font-size: 8px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  padding: 3px 8px; border-radius: 2px; margin-bottom: 12px;
}
.type-livehouse { background: rgba(181,126,220,0.18); color: #7a3aaa; border: 1px solid rgba(181,126,220,0.3); }
.type-bar       { background: rgba(99,170,220,0.16);  color: #2a4a8a; border: 1px solid rgba(99,170,220,0.28); }
.type-art       { background: rgba(99,214,198,0.18);  color: #2a7a6a; border: 1px solid rgba(99,214,198,0.3); }
.type-venue     { background: rgba(232,200,120,0.22); color: #7a5010; border: 1px solid rgba(232,200,120,0.35); }
.type-studio    { background: rgba(100,180,100,0.16); color: #2a6a2a; border: 1px solid rgba(100,180,100,0.28); }
.type-cafe      { background: rgba(220,170,110,0.18); color: #6a3a10; border: 1px solid rgba(220,170,110,0.3); }
.type-other     { background: rgba(160,160,160,0.12); color: #4a4a4a; border: 1px solid rgba(160,160,160,0.22); }

.place-name { font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 900; color: #2a1a05; line-height: 1.35; margin-bottom: 6px; }
.place-city { font-size: 9px; font-weight: 700; letter-spacing: 2px; color: #9a7a30; margin-bottom: 10px; }
.place-desc { font-size: 11px; color: rgba(40,25,5,0.48); line-height: 1.7; font-family: Arial, sans-serif; margin-bottom: 14px; }

.place-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.place-tag {

  background: rgba(255,255,255,0.45); color: rgba(40,25,5,0.4);

.place-arrow {
  display: block; margin-top: 16px; font-size: 9px; font-weight: 700;
  letter-spacing: 2px; color: #9a7a30; opacity: 0; transform: translateX(-4px); transition: all 0.25s;
}
.place-card:hover .place-arrow { opacity: 1; transform: translateX(0); }

/* EMPTY */
.empty-state {
  padding: 72px 36px; text-align: center;

@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 680px) {

<script>
  const places = [
    // {
    //   name: '範例場地', type: 'Live House', city: '台北市 Taipei',
    //   desc: '友善酷兒的 live house。', tags: ['女性友善', 'Queer'], url: '#'
    // },
  ];

  const typeCssMap = {
    'Live House': 'type-livehouse', 'Music Bar': 'type-bar',
    '藝文空間 Art Space': 'type-art', '展演空間 Venue': 'type-venue',
    '錄音室 Recording Studio': 'type-studio', '排練室 Rehearsal Studio': 'type-studio',
    '唱片行 Record Store': 'type-other', '咖啡店 Cafe': 'type-cafe',
  };

  let activeCity = '', activeType = '';

  function render() {
    const filtered = places.filter(p => {
      if (activeCity && p.city !== activeCity) return false;
      if (activeType && p.type !== activeType) return false;
      return true;
    });

    document.getElementById('count').textContent = filtered.length;
    const grid  = document.getElementById('places-grid');
    const empty = document.getElementById('empty-state');
    grid.innerHTML = '';

    if (filtered.length === 0) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    filtered.forEach((p, i) => {
      const css = typeCssMap[p.type] || 'type-other';
      const card = document.createElement('a');
      card.href = p.url || '#';
      card.className = 'place-card';
      card.innerHTML = `
        <div class="place-num">${String(i + 1).padStart(2, '0')}</div>
        <span class="place-type ${css}">${p.type}</span>
        <div class="place-name">${p.name}</div>
        <div class="place-city">◎ ${p.city}</div>
        ${p.desc ? `<div class="place-desc">${p.desc}</div>` : ''}
        <div class="place-tags">${(p.tags||[]).map(t=>`<span class="place-tag">${t}</span>`).join('')}</div>
        <span class="place-arrow">→ 查看</span>
      `;
      grid.appendChild(card);
    });
  }

  document.querySelectorAll('.city-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.city-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCity = btn.dataset.value;
      render();
    });
  });

  document.querySelectorAll('.type-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.type-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeType = btn.dataset.value;
      render();
    });
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    activeCity = ''; activeType = '';
    document.querySelectorAll('.city-chip, .type-chip').forEach(b => b.classList.remove('active'));
    document.querySelector('.city-chip[data-value=""]').classList.add('active');
    document.querySelector('.type-chip[data-value=""]').classList.add('active');
    render();
  });

  render();
</script>

    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    const placeCityFilter = document.getElementById("placeCityFilter");
    const placeTypeFilter = document.getElementById("placeTypeFilter");
    const resetPlaceFilters = document.getElementById("resetPlaceFilters");
    const placesGrid = document.getElementById("placesGrid");
    const placesEmpty = document.getElementById("placesEmpty");
    const placeResultCount = document.getElementById("placeResultCount");

    let approvedPlaces = [];

    function parseMultiValue(value) {
      if (!value) return [];
      return value
        .split(",")
        .map(item => item.trim())
        .filter(Boolean);
    }

    function renderPlaces(items) {
      placesGrid.innerHTML = items.map((place) => {
        const types = parseMultiValue(place.type);
        const typeText = types.length ? types.join("、") : "未填寫類型";

        const linkHtml = place.link
          ? `<p><strong>連結：</strong><a href="${place.link}" target="_blank" rel="noopener noreferrer">${place.link}</a></p>`
          : `<p><strong>連結：</strong>未提供</p>`;

        return `
          <article class="profile-card">
            <h3>${place.name || ""}</h3>
            <p class="profile-meta">${place.city || "未填寫城市"}</p>
            <p><strong>類型：</strong>${typeText}</p>
            <p>${place.description || ""}</p>
            ${linkHtml}
          </article>
        `;
      }).join("");

      placeResultCount.textContent = items.length;
      placesEmpty.hidden = items.length !== 0;
    }

    function filterPlaces() {
      const selectedCity = placeCityFilter.value;
      const selectedType = placeTypeFilter.value;

      const filtered = approvedPlaces.filter((place) => {
        const types = parseMultiValue(place.type);

        const cityMatch =
          selectedCity === "all" || place.city === selectedCity;

        const typeMatch =
          selectedType === "all" || types.includes(selectedType);

        return cityMatch && typeMatch;
      });

      renderPlaces(filtered);
    }

    async function initPlaces() {
      try {
        const { data, error } = await supabase
          .from("places")
          .select("*")
          .eq("review_status", "approved")
          .eq("consent_public", true)
          .order("created_at", { ascending: false });

        if (error) throw error;

        approvedPlaces = data || [];
        filterPlaces();

        placeCityFilter.addEventListener("change", filterPlaces);
        placeTypeFilter.addEventListener("change", filterPlaces);

        resetPlaceFilters.addEventListener("click", () => {
          placeCityFilter.value = "all";
          placeTypeFilter.value = "all";
          filterPlaces();
        });
      } catch (error) {
        placesGrid.innerHTML = `<p class="error-text">${error.message || "讀取資料失敗"}</p>`;
      }
    }

    initPlaces();
  </script>
