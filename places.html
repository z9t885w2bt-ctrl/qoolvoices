  let approvedPlaces = [];

  function parseMultiValue(value) {
    if (!value) return [];
    return value.split(",").map(item => item.trim()).filter(Boolean);
  }

  function renderPlaces(items) {
    placesGrid.innerHTML = items.map((place) => {
      const types = parseMultiValue(place.type);
      const typeText = types.length ? types.join("、") : "未填寫類型";

      const linkHtml = place.link
        ? `<a class="place-link-btn" href="${place.link}" target="_blank" rel="noopener noreferrer">Get in touch →</a>`
        : "";

      return `
        <article class="profile-card">
          <h3>${place.name || ""}</h3>
          <p class="profile-meta">◎ ${place.city || "未填寫城市"}</p>
          <p><strong>類型：</strong>${typeText}</p>
          ${place.description ? `<p>${place.description}</p>` : ""}
          ${linkHtml}
        </article>
      `;
    }).join("");

    placeResultCount.textContent = items.length;
    placesEmpty.hidden = items.length !== 0;
  }

  function filterPlaces() {
    const selectedCity = placeCityFilter.value;
    const selectedType = placeTypeFilter.value;

    const filtered = approvedPlaces.filter((place) => {
      const types = parseMultiValue(place.type);
      const cityMatch = selectedCity === "all" || place.city === selectedCity;
      const typeMatch = selectedType === "all" || types.includes(selectedType);
      return cityMatch && typeMatch;
    });

    renderPlaces(filtered);
  }

  async function initPlaces() {
    try {
      const { data, error } = await supabase
        .from("places")
        .select("*")
        .eq("review_status", "approved")
        .eq("consent_public", true)
        .order("created_at", { ascending: false });

      if (error) throw error;

      approvedPlaces = data || [];
      filterPlaces();

      placeCityFilter.addEventListener("change", filterPlaces);
      placeTypeFilter.addEventListener("change", filterPlaces);

      resetPlaceFilters.addEventListener("click", () => {
        placeCityFilter.value = "all";
        placeType
