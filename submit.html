<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>加入資料酷｜Qool Voices</title>

<link rel="stylesheet" href="style.css" />

</head>

<body>

<header class="site-header">

<div class="nav-wrap">

<a href="index.html" class="logo-link">

<div class="logo-slot">LOGO</div>

<div class="brand-block">
<p class="brand-en">Qool Voices</p>
<h1 class="brand-zh">酷女聲</h1>
</div>

</a>

<nav class="main-nav">
<a href="about.html">About</a>
<a href="interviews.html">Interviews</a>
<a href="directory.html">Directory</a>
<a href="contact.html">Contact</a>
</nav>

</div>

</header>


<main class="page-content">

<section class="content-card form-card">

<p class="section-label">Join Directory</p>

<h2>加入資料酷</h2>

<p class="section-intro">
填寫資料後，酷女聲會進行審核，
通過後你的資料會出現在 資料酷 中。
</p>


<form id="submitForm" class="profile-form">

<label>
名字 / 藝名
<input type="text" name="name" required>
</label>

<details class="form-section">

<summary>活動地區（可複選）</summary>

<div class="checkbox-group">

<label><input type="checkbox" name="regions" value="north"> 北部</label>
<label><input type="checkbox" name="regions" value="middle"> 中部</label>
<label><input type="checkbox" name="regions" value="south"> 南部</label>
<label><input type="checkbox" name="regions" value="east"> 東部</label>
<label><input type="checkbox" name="regions" value="outer_islands"> 離島</label>
</div>

</details>


<details class="form-section">

<summary>職能（可複選）</summary>

<div class="checkbox-group">

<label><input type="checkbox" name="roles" value="Singer"> 歌手 Singer</label>
<label><input type="checkbox" name="roles" value="Rapper"> 饒舌 Rapper</label>
<label><input type="checkbox" name="roles" value="Instrumentalist"> 樂手 Instrumentalist</label>
<label><input type="checkbox" name="roles" value="DJ"> DJ</label>
<label><input type="checkbox" name="roles" value="Producer"> 製作人 Producer</label>
<label><input type="checkbox" name="roles" value="Songwriter"> 作曲 Songwriter</label>
<label><input type="checkbox" name="roles" value="Lyricist"> 作詞 Lyricist</label>

<label><input type="checkbox" name="roles" value="Lighting"> 燈光 Lighting</label>
<label><input type="checkbox" name="roles" value="Photographer"> 攝影 Photographer</label>
<label><input type="checkbox" name="roles" value="Visual Artist"> 視覺 Visual Artist</label>
</div>

</details>



<details class="form-section">

<summary>風格（可複選）</summary>

<div class="checkbox-group">

<label><input type="checkbox" name="styles" value="Indie"> Indie</label>
<label><input type="checkbox" name="styles" value="Electronic"> Electronic</label>
<label><input type="checkbox" name="styles" value="Experimental"> Experimental</label>
<label><input type="checkbox" name="styles" value="Ambient"> Ambient</label>
<label><input type="checkbox" name="styles" value="Noise"> Noise</label>
<label><input type="checkbox" name="styles" value="Techno"> Techno</label>
<label><input type="checkbox" name="styles" value="House"> House</label>
<label><input type="checkbox" name="styles" value="Hip-hop"> Hip-hop</label>
<label><input type="checkbox" name="styles" value="Pop"> Pop</label>
</div>

</details>


<label>
自我介紹
<textarea name="bio" rows="5"></textarea>
</label>


<label>
聯絡方式（可自由填寫，多種聯絡方式可換行）
<textarea
name="contact"
rows="4"
placeholder="IG: @example
Email: example@email.com
Telegram: @example">
</textarea>
</label>


<label class="consent-check">

<input type="checkbox" name="consent_public" required>

我同意酷女聲公開我的資料

</label>


<button type="submit" class="cta-button">
送出資料
</button>


<p id="formMessage"></p>


</form>


</section>

</main>


<script>
const form = document.getElementById("submitForm");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const formData = new FormData(form);

  const regions = Array.from(
    document.querySelectorAll('input[name="regions"]:checked')
  ).map(cb => cb.value);

  const roles = Array.from(
    document.querySelectorAll('input[name="roles"]:checked')
  ).map(cb => cb.value);

  const styles = Array.from(
    document.querySelectorAll('input[name="styles"]:checked')
  ).map(cb => cb.value);

  const data = {
    name: formData.get("name"),
    city: regions.join(", "),
    role: roles.join(", "),
    style: styles.join(", "),
    bio: formData.get("bio"),
    contact: formData.get("contact"),
    consent_public: formData.get("consent_public") === "on"
  };

  const msg = document.getElementById("formMessage");
  msg.textContent = "送出中...";

  try {
    const response = await fetch("/.netlify/functions/submit-profile", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (response.ok) {
      msg.textContent = "送出成功，等待審核";
      form.reset();
    } else {
      msg.textContent = result.error || "送出失敗，請稍後再試";
    }
  } catch (error) {
    msg.textContent = "送出失敗，請稍後再試";
  }
});
</script>
